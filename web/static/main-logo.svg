<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A9EFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A5FBF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wrenchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD166;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F4A800;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000033"/>
    </filter>
  </defs>

  <!-- Gear body -->
  <g filter="url(#shadow)">
    <path fill="url(#gearGrad)" d="
      M60,20
      L64,14 L68,20
      Q74,18 79,22
      L82,16 L87,19
      Q90,24 91,30
      L98,30 L99,36
      Q100,42 97,47
      L103,51 L101,57
      Q98,62 94,65
      L97,71 L93,75
      Q88,79 83,80
      L83,88 L77,89
      Q71,90 65,88
      L63,95 L57,95
      Q51,94 47,90
      L41,93 L37,89
      Q33,85 32,79
      L25,77 L24,71
      Q22,65 25,59
      L19,55 L21,49
      Q24,44 28,41
      L25,35 L30,31
      Q35,27 41,26
      L41,19 L47,18
      Q53,17 60,20Z
    "/>
    <!-- Inner gear circle -->
    <circle cx="60" cy="57" r="18" fill="#1040A0"/>
    <circle cx="60" cy="57" r="12" fill="#0D2D6B"/>
  </g>

  <!-- Wrench overlaid -->
  <g filter="url(#shadow)" transform="rotate(-35 60 60)">
    <rect x="56" y="30" width="8" height="50" rx="4" fill="url(#wrenchGrad)"/>
    <!-- Wrench head open end -->
    <path fill="url(#wrenchGrad)" d="M52,34 Q44,34 44,42 Q44,50 52,50 L52,46 Q48,46 48,42 Q48,38 52,38Z"/>
    <path fill="url(#wrenchGrad)" d="M68,34 Q76,34 76,42 Q76,50 68,50 L68,46 Q72,46 72,42 Q72,38 68,38Z"/>
    <!-- Wrench tail circle -->
    <circle cx="60" cy="76" r="6" fill="url(#wrenchGrad)"/>
    <circle cx="60" cy="76" r="3" fill="#C07800"/>
  </g>
</svg>
