<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manual Assistant (local RAG)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Exo+2:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #f4f5f9;
      --panel: #ffffff;
      --text: #1f2230;
      --muted: #666d7d;
      --accent: #7a2fa0;
      --border: #d9dce4;
    }
    body[data-theme="dark"] {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #8b98a8;
      --accent: #3d8bfd;
      --border: #2a3544;
    }
    * { box-sizing: border-box; }
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      line-height: 1.5;
    }
    .wrap {
      max-width: 940px;
      margin: 0 auto;
      padding: 1rem;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    h1 {
      font-weight: 600;
      font-size: 1.1rem;
      margin: 0 0 0.25rem 0;
    }
    .sub { color: var(--muted); font-size: 0.85rem; margin: 0; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.75rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
    }
    .topbar-left { display: flex; flex-direction: column; gap: 0.12rem; }
    .topbar-head {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-wrap: wrap;
    }
    .btn-theme {
      margin-left: 0;
      margin-top: 0;
      padding: 0.34rem 0.62rem;
      font-size: 0.76rem;
      border-radius: 999px;
      background: #ebe6f2;
      color: #4b2763;
      border: 1px solid #d7cae7;
    }
    .lang-select {
      margin-left: 0;
      margin-top: 0;
      padding: 0.34rem 0.55rem;
      font-size: 0.76rem;
      border-radius: 999px;
      background: #ebe6f2;
      color: #4b2763;
      border: 1px solid #d7cae7;
    }
    body[data-theme="dark"] .btn-theme {
      background: #273448;
      border-color: #334662;
      color: #dce7fb;
    }
    body[data-theme="dark"] .lang-select {
      background: #273448;
      border-color: #334662;
      color: #dce7fb;
    }
    .composer-model-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.45rem;
      flex-wrap: wrap;
    }
    .composer-model-row .model-label {
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
      min-width: 74px;
    }
    .composer-model-row .model-select {
      margin-left: 0;
      min-width: 220px;
      max-width: 100%;
      flex: 1 1 260px;
      font-size: 0.82rem;
      padding: 0.35rem 0.5rem;
    }
    .status-menu {
      position: relative;
      margin-left: auto;
      flex: 0 0 auto;
    }
    .status-dot-btn {
      width: 16px;
      height: 16px;
      border-radius: 999px;
      border: 1px solid #4a5566;
      background: #5b6372;
      box-shadow: 0 0 0 2px rgba(9, 12, 18, 0.35);
      cursor: pointer;
      padding: 0;
    }
    .status-dot-btn.status-ready {
      background: #2dcf73;
      border-color: #1b9d52;
      box-shadow: 0 0 0 2px rgba(45, 207, 115, 0.15);
    }
    .status-dot-btn.status-error {
      background: #d15d64;
      border-color: #a7464d;
      box-shadow: 0 0 0 2px rgba(209, 93, 100, 0.14);
    }
    .status-popover {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      z-index: 20;
      min-width: min(78vw, 620px);
      max-width: min(90vw, 760px);
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      padding: 0.55rem 0.65rem;
      display: none;
    }
    .status-popover.open {
      display: block;
    }
    .status-popover .status-text {
      font-size: 0.76rem;
      color: var(--muted);
      line-height: 1.35;
      word-break: break-word;
    }
    .status-popover .status-text.ok {
      color: #7ddba2;
    }
    .status-popover .status-text.err {
      color: #f2a3a8;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem 1rem;
    }
    .chat-area {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .conversation {
      flex: 1;
      min-height: 0;
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .chat-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
      flex-shrink: 0;
    }
    .chat-model-indicator {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: min(64%, 36ch);
    }
    .chat-toolbar button {
      margin-top: 0;
      padding: 0.35rem 0.65rem;
      font-size: 0.8rem;
    }
    .clear-label-mobile {
      display: none;
    }
    .chat-messages {
      flex: 1;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .chat-messages:empty::before {
      content: var(--chat-empty-text, "Ask about your manual below - each question and answer appears here.");
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.45;
      display: block;
      padding: 0.35rem 0.15rem 0.5rem;
      max-width: 52ch;
    }
    .msg-row {
      display: flex;
      width: 100%;
    }
    .msg-row.msg-user { justify-content: flex-end; }
    .msg-row.msg-assistant { justify-content: flex-start; flex-direction: column; align-items: flex-start; }
    .bubble {
      max-width: min(85%, 78ch);
      padding: 0.75rem 0.95rem;
      border-radius: 14px;
      font-size: 0.94rem;
      line-height: 1.55;
      word-break: break-word;
    }
    .bubble-user {
      background: #1e3a5f;
      border: 1px solid #2a4a72;
      color: #eaf2ff;
      border-bottom-right-radius: 4px;
    }
    .bubble-assistant {
      background: #101722;
      border: 1px solid var(--border);
      color: #dfe7f3;
      white-space: pre-wrap;
      border-bottom-left-radius: 4px;
    }
    .bubble-assistant.bubble-err {
      border-color: #6a3035;
      background: #1a1214;
      color: #f5b8bc;
    }
    .msg-meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.35rem;
      margin-left: 0.15rem;
      max-width: min(92%, 85ch);
      line-height: 1.4;
    }
    .source-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
      margin-top: 0.15rem;
    }
    .source-chip {
      display: inline-block;
      font-size: 0.76rem;
      padding: 0.22rem 0.5rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #0f1620;
      color: var(--muted);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    a.source-chip.source-chip-link {
      text-decoration: none;
      color: var(--accent);
      cursor: pointer;
    }
    a.source-chip.source-chip-link:hover {
      border-color: var(--accent);
      background: #121c28;
    }
    .community-chip {
      border-color: #3d5a40;
      background: #0f1a12;
      color: #9bc49e;
    }
    .msg-community-slot {
      margin-top: 0.35rem;
      margin-left: 0.15rem;
      width: 100%;
      max-width: min(100%, 100ch);
      box-sizing: border-box;
    }
    .community-save-toggle {
      font-size: 0.76rem;
      color: var(--accent);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.15rem 0;
      text-decoration: underline;
    }
    .community-save-toggle:hover {
      color: color-mix(in srgb, var(--accent) 70%, var(--text) 30%);
    }
    .community-save-panel {
      margin-top: 0.45rem;
      padding: 0.55rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      display: none;
      flex-direction: column;
      gap: 0.45rem;
    }
    .community-save-panel.open {
      display: flex;
    }
    .community-save-panel label {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text);
    }
    .community-save-panel input,
    .community-save-panel textarea {
      width: 100%;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 0.85rem;
      padding: 0.4rem 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
    }
    .community-save-panel input::placeholder,
    .community-save-panel textarea::placeholder {
      color: var(--muted);
      opacity: 1;
    }
    body[data-theme="dark"] .community-save-panel input::placeholder,
    body[data-theme="dark"] .community-save-panel textarea::placeholder {
      color: #b0bcc8;
    }
    .community-save-panel textarea {
      min-height: 2.65rem;
      max-height: 10rem;
      resize: vertical;
      line-height: 1.35;
    }
    .community-voice-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
    }
    .community-voice-row .btn-secondary {
      font-size: 0.78rem;
      padding: 0.28rem 0.5rem;
      margin-left: 0;
    }
    .community-save-panel > .btn-secondary {
      margin-left: 0;
    }
    .community-save-panel > .btn-secondary ~ .btn-secondary {
      margin-left: 0.35rem;
    }
    .community-save-status {
      font-size: 0.76rem;
      color: var(--muted);
    }
    .community-save-status.ok {
      color: #5bd37a;
    }
    .community-save-status.err {
      color: #f07178;
    }
    .community-save-context {
      padding: 0.45rem 0.55rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      font-size: 0.74rem;
      line-height: 1.45;
      color: var(--text);
    }
    .community-save-context strong {
      display: block;
      margin-bottom: 0.15rem;
      color: var(--text);
      font-size: 0.76rem;
      font-weight: 600;
    }
    .community-save-hint {
      font-size: 0.72rem;
      margin: 0;
      line-height: 1.4;
      color: color-mix(in srgb, var(--text) 58%, var(--muted) 42%);
    }
    body[data-theme="dark"] .community-save-hint {
      color: color-mix(in srgb, var(--text) 72%, var(--muted) 28%);
    }
    .bubble-thinking {
      white-space: normal !important;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      min-height: 2.6rem;
      color: var(--muted);
    }
    .thinking-dots {
      display: inline-flex;
      gap: 0.12rem;
      letter-spacing: 0;
    }
    .thinking-dots span {
      display: inline-block;
      font-weight: 700;
      animation: thinkingDot 1.05s ease-in-out infinite;
    }
    .thinking-dots span:nth-child(1) { animation-delay: 0s; }
    .thinking-dots span:nth-child(2) { animation-delay: 0.15s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes thinkingDot {
      0%, 70%, 100% { opacity: 0.15; transform: translateY(0); }
      35% { opacity: 1; transform: translateY(-1px); }
    }
    .composer {
      position: sticky;
      bottom: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.85rem;
      box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.2);
    }
    .composer-collapse-toggle {
      display: none;
      width: 100%;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0;
      margin: 0;
      border: none;
      border-radius: 8px;
      background: #1e2a3d;
      color: var(--muted);
      font-size: 0.8rem;
      cursor: pointer;
      min-height: 40px;
    }
    button.composer-collapse-toggle {
      background: #1e2a3d;
      color: var(--muted);
    }
    .composer-collapse-toggle:hover {
      color: var(--text);
      background: #243044;
    }
    .composer-toggle-icon {
      font-size: 0.7rem;
      line-height: 1;
      color: var(--accent);
    }
    .composer-toggle-label {
      font-weight: 500;
      color: var(--text);
    }
    .composer--collapsed .composer-toggle-icon {
      transform: none;
    }
    .composer-controls {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .pdf-drawer {
      border: none;
      margin: 0;
      padding: 0;
    }
    .pdf-drawer-summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.55rem 0.75rem;
      margin-top: 0.35rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #141c28;
      font-size: 0.82rem;
      color: var(--muted);
      user-select: none;
    }
    .pdf-drawer-summary::-webkit-details-marker {
      display: none;
    }
    .pdf-drawer-title {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-weight: 600;
      color: var(--text);
    }
    .pdf-drawer-chevron::after {
      content: "▸";
      display: inline-block;
      transition: transform 0.15s ease;
      color: var(--muted);
    }
    .pdf-drawer:not([open]) .pdf-drawer-chevron::after {
      transform: rotate(0deg);
    }
    .pdf-drawer[open] .pdf-drawer-chevron::after {
      transform: rotate(90deg);
    }
    .pdf-drawer-hint {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 400;
    }
    @media (max-width: 380px) {
      .pdf-drawer-hint {
        display: none;
      }
    }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.35rem; }
    .kbd-hint {
      font-weight: 400;
      font-size: 0.78rem;
      color: #6a7686;
    }
    .kbd-hint-mobile {
      display: none;
      font-weight: 400;
      font-size: 0.78rem;
      color: #6a7686;
    }
    @media (min-width: 721px) {
      body[data-lang="it"]:not([data-theme="blueprint"]) #lblAskManual {
        white-space: nowrap;
        font-size: 0.8rem;
      }
      body[data-lang="it"]:not([data-theme="blueprint"]) #lblKbdHint {
        font-size: 0.72rem;
      }
    }
    input[type="file"] {
      width: 100%;
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
    }
    .file-inline {
      width: 280px;
      max-width: 100%;
      margin-left: 0.2rem;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: 1px solid transparent;
      padding: 0.55rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 0;
      font-weight: 600;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, opacity 0.15s ease;
    }
    button:hover:not(:disabled) {
      filter: brightness(0.96);
    }
    button:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, #ffffff 45%);
      outline-offset: 2px;
    }
    .btn-secondary {
      background: #eef1f6;
      color: #1f2633;
      border-color: #ccd3df;
      margin-left: 0.45rem;
    }
    .btn-secondary:hover:not(:disabled) {
      background: #e5eaf2;
      border-color: #bec8d7;
      filter: none;
    }
    body[data-theme="dark"] .btn-secondary {
      background: #2a3544;
      color: #dce5f2;
      border-color: #36465c;
    }
    body[data-theme="dark"] .btn-secondary:hover:not(:disabled) {
      background: #334257;
      border-color: #455773;
    }
    .btn-danger {
      background: #5b2327;
      color: #ffd6d9;
      border: 1px solid #8a3a40;
    }
    .btn-danger:hover {
      background: #6e2a2f;
    }
    .btn-recording {
      background: #b94a48;
      color: #fff;
    }
    select {
      padding: 0.45rem 0.55rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      margin-left: 0.45rem;
      margin-top: 0;
    }
    button:disabled {
      opacity: 0.62;
      cursor: not-allowed;
      color: #5f6675;
      border-color: #cfd4de;
      background: #eceff4;
    }
    body[data-theme="dark"] button:disabled {
      color: #8b98a8;
      border-color: #3a485d;
      background: #2b3341;
    }
    textarea {
      width: 100%;
      min-height: 100px;
      padding: 0.65rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      resize: vertical;
      font-family: inherit;
    }
    .control-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.55rem;
    }
    .control-row-primary {
      margin-top: 0.5rem;
    }
    .control-row-pdf {
      margin-top: 0.35rem;
    }
    .status {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }
    .community-admin {
      margin-top: 0.55rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #f1f3f8;
      overflow: hidden;
    }
    .community-admin summary {
      list-style: none;
      cursor: pointer;
      padding: 0.5rem 0.65rem;
      font-size: 0.8rem;
      color: #1f2633;
      user-select: none;
      border-bottom: 1px solid transparent;
      background: #e9edf4;
    }
    .community-admin[open] summary {
      border-bottom-color: var(--border);
      background: #e2e8f2;
    }
    .community-admin summary::-webkit-details-marker { display: none; }
    .community-admin-body {
      padding: 0.55rem 0.65rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .community-admin-toolbar {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-wrap: wrap;
    }
    .community-admin-section-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
      margin: 0.2rem 0 0.05rem 0;
    }
    .community-admin-add {
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #f8fafc;
      padding: 0.5rem 0.55rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .community-admin-add label {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text);
    }
    .community-admin-add input,
    .community-admin-add textarea {
      width: 100%;
      box-sizing: border-box;
      font-size: 0.85rem;
      line-height: 1.4;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.45rem 0.5rem;
    }
    .community-admin-add textarea#communityNewComment {
      min-height: 5.5rem;
    }
    .community-admin-add-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
      margin-top: 0.15rem;
    }
    .community-admin-add-actions .btn-secondary {
      margin-left: 0;
    }
    .community-admin-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      max-height: 240px;
      overflow: auto;
    }
    .community-admin-item {
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #ffffff;
      padding: 0.45rem 0.55rem;
      display: flex;
      flex-direction: column;
      gap: 0.28rem;
    }
    .community-admin-item-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 0.35rem 0.5rem;
    }
    .community-admin-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 0.35rem;
      flex-shrink: 0;
    }
    .community-admin-actions .btn-secondary {
      margin-left: 0;
    }
    .community-admin-item-head .community-admin-meta {
      min-width: 0;

    function fmtTime(ts) {
      if (!ts) return "unknown time";
      try {
        return new Date(Number(ts) * 1000).toLocaleString();
      } catch (_) {
        return "unknown time";
      }
    }

    async function refreshCommunityAdminList() {
      const box = $("communityAdmin");
      const list = $("communityAdminList");
      const st = $("communityAdminStatus");
      if (!box || !list || !st || !serverCommunityEnabled) return;
      st.textContent = "Loading…";
      st.className = "status";
      try {
        const r = await fetch("/api/community?limit=200");
        const raw = await r.text();
        let j = {};
        try { j = raw ? JSON.parse(raw) : {}; } catch (_) {}
        if (!r.ok) {
          const detail = j.detail !== undefined ? (typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail)) : (raw || r.statusText);
          throw new Error(detail);
        }
        const items = Array.isArray(j.items) ? j.items : [];
        list.innerHTML = "";
        if (!items.length) {
          const empty = document.createElement("div");
          empty.className = "community-admin-meta";
          empty.textContent = "No community notes saved yet.";
          list.appendChild(empty);
        } else {
          for (const it of items) {
            const row = document.createElement("div");
            row.className = "community-admin-item";
            const head = document.createElement("div");
            head.className = "community-admin-item-head";
            const meta = document.createElement("div");
            meta.className = "community-admin-meta";
            meta.textContent = `${it.author || "Anonymous"} · ${fmtTime(it.saved_ts)} · id ${it.id || ""}`;
            const edit = document.createElement("button");
            edit.type = "button";
            edit.className = "btn-secondary btn-community-edit";
            edit.textContent = t("editNote") || "Edit";
            edit.title = (t("editNote") || "Edit") + " — change question, note, author, answer snapshot";
            edit.setAttribute("aria-label", t("editNote") || "Edit");
            const del = document.createElement("button");
            del.type = "button";
            del.className = "btn-secondary btn-danger";
            del.textContent = "Delete";
            del.onclick = async () => {
              if (!it.id) return;
              if (!window.confirm("Delete this community note?")) return;
              del.disabled = true;
              try {
                const rr = await fetch(`/api/community/${encodeURIComponent(it.id)}`, { method: "DELETE" });
                const body = await rr.text();
                let jj = {};
                try { jj = body ? JSON.parse(body) : {}; } catch (_) {}
                if (!rr.ok) {
                  const detail = jj.detail !== undefined ? (typeof jj.detail === "string" ? jj.detail : JSON.stringify(jj.detail)) : (body || rr.statusText);
                  throw new Error(detail);
                }
                row.remove();
                st.textContent = "Deleted note.";
                st.className = "status ok";
              } catch (e) {
                st.textContent = String(e.message || e);
                st.className = "status err";
                del.disabled = false;
              }
            };
            const actions = document.createElement("div");
            actions.className = "community-admin-actions";
            actions.appendChild(edit);
            actions.appendChild(del);
            head.appendChild(meta);
            head.appendChild(actions);
            const q = document.createElement("div");
            q.className = "community-admin-question";
            q.textContent = `Q: ${(it.question || "").trim().slice(0, 220) || "(empty)"}`;
            const c = document.createElement("div");
            c.className = "community-admin-meta";
            c.textContent = `Note: ${(it.comment || "").trim().slice(0, 260) || "(empty)"}`;
            const hint = document.createElement("div");
            hint.className = "community-admin-edit-hint";
            hint.textContent = t("editNoteHint");
            const editWrap = document.createElement("div");
            editWrap.className = "community-admin-edit-panel";
            const qTa = document.createElement("textarea");
            qTa.rows = 2;
            qTa.placeholder = "Question / context";
            qTa.value = (it.question || "").trim();
            const cTa = document.createElement("textarea");
            cTa.rows = 5;
            cTa.placeholder = "Community note";
            cTa.value = (it.comment || "").trim();
            const authInp = document.createElement("input");
            authInp.type = "text";
            authInp.placeholder = "Author (optional)";
            authInp.value = (it.author || "").trim();
            const ansTa = document.createElement("textarea");
            ansTa.rows = 3;
            ansTa.placeholder = "Answer snapshot (optional)";
            ansTa.value = (it.answer_excerpt || "").trim();
            const btnRow = document.createElement("div");
            btnRow.className = "community-admin-add-actions";
            const saveBtn = document.createElement("button");
            saveBtn.type = "button";
            saveBtn.className = "btn-secondary";
            saveBtn.textContent = t("saveNoteChanges");
            const cancelBtn = document.createElement("button");
            cancelBtn.type = "button";
            cancelBtn.className = "btn-secondary";
            cancelBtn.textContent = t("cancelEdit");
            cancelBtn.onclick = () => {
              editWrap.classList.remove("open");
            };
            saveBtn.onclick = async () => {
              const payload = {
                question: qTa.value.trim(),
                comment: cTa.value.trim(),
                author: authInp.value.trim(),
                answer_snapshot: ansTa.value.trim(),
              };
              if (!payload.comment) {
                st.textContent = "Note text cannot be empty.";
                st.className = "status err";
                return;
              }
              saveBtn.disabled = true;
              try {
                const rr = await fetch(`/api/community/${encodeURIComponent(it.id)}`, {
                  method: "PUT",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify(payload),
                });
                const body = await rr.text();
                let jj = {};
                try {
                  jj = body ? JSON.parse(body) : {};
                } catch (_) {}
                if (!rr.ok) {
                  const detail =
                    jj.detail !== undefined
                      ? typeof jj.detail === "string"
                        ? jj.detail
                        : JSON.stringify(jj.detail)
                      : body || rr.statusText;
                  throw new Error(detail);
                }
                st.textContent = "Note updated.";
                st.className = "status ok";
                editWrap.classList.remove("open");
                await refreshCommunityAdminList();
              } catch (e) {
                st.textContent = String(e.message || e);
                st.className = "status err";
              }
              saveBtn.disabled = false;
            };
            btnRow.appendChild(saveBtn);
            btnRow.appendChild(cancelBtn);
            editWrap.appendChild(qTa);
            editWrap.appendChild(cTa);
            editWrap.appendChild(authInp);
            editWrap.appendChild(ansTa);
            editWrap.appendChild(btnRow);
            edit.onclick = () => {
              editWrap.classList.toggle("open");
            };
            row.appendChild(head);
            row.appendChild(q);
            row.appendChild(c);
            row.appendChild(hint);
            row.appendChild(editWrap);
            list.appendChild(row);
          }
        }
        st.textContent = `${items.length} note(s) loaded`;
        st.className = "status ok";
      } catch (e) {
        st.textContent = String(e.message || e);
        st.className = "status err";
      }
    }

    async function saveNewCommunityNoteFromAdmin() {
      const st = $("communityAdminStatus");
      if (!serverCommunityEnabled) return;
      const q = ($("communityNewQuestion") && $("communityNewQuestion").value.trim()) || "";
      const c = ($("communityNewComment") && $("communityNewComment").value.trim()) || "";
      const author = ($("communityNewAuthor") && $("communityNewAuthor").value.trim()) || "";
      const answer_snapshot = ($("communityNewAnswer") && $("communityNewAnswer").value.trim()) || "";
      if (!c) {
        if (st) {
          st.textContent = "Please enter a community note.";
          st.className = "status err";
        }
        return;
      }
      const btn = $("btnCommunitySaveNew");
      if (btn) btn.disabled = true;
      if (st) {
        st.textContent = "Saving…";
        st.className = "status";
      }
      try {
        const r = await fetch("/api/community-save", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            question: q,
            comment: c,
            author,
            answer_snapshot: answer_snapshot.slice(0, 4000),
          }),
        });
        const raw = await r.text();
        let j = {};
        try {
          j = raw ? JSON.parse(raw) : {};
        } catch (_) {}
        if (!r.ok) {
          const detail =
            j.detail !== undefined
              ? typeof j.detail === "string"
                ? j.detail
                : JSON.stringify(j.detail)
              : raw || r.statusText;
          throw new Error(detail);
        }
        if (st) {
          st.textContent = "Note saved.";
          st.className = "status ok";
        }
        clearCommunityAddForm();
        await refreshCommunityAdminList();
      } catch (e) {
        if (st) {
          st.textContent = String(e.message || e);
          st.className = "status err";
        }
      }
      if (btn) btn.disabled = false;
    }

    function pickWhisperMime() {
      const candidates = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"];
      for (const m of candidates) {
        try {
          if (MediaRecorder.isTypeSupported(m)) return m;
        } catch (_) {}
      }
      return "";
    }

    function setWhisperUi(recording) {
      const mainB = $("btnWhisper");
      const commB = whisperContext && whisperContext.whisperBtn;
      const targets = commB ? [commB] : mainB ? [mainB] : [];
      for (const b of targets) {
        if (recording) {
          b.textContent = t("stopAndSend");
          b.classList.add("btn-recording");
        } else {
          b.textContent = commB ? t("whisperToNote") : t("whisperRecord");
          b.classList.remove("btn-recording");
        }
      }
      if (recording && commB && mainB) {
        mainB.disabled = true;
        mainB.title = "Finish community Whisper first";
      } else if (!recording && mainB) {
        applyWhisperBtnState();
      }
    }

    function applyWhisperBtnState() {
      const b = $("btnWhisper");
      if (!b) return;
      const mr = typeof MediaRecorder !== "undefined";
      const can = serverWhisperAvailable && mr;
      b.disabled = !can;
      b.title = can
        ? "Record audio; server transcribes with Whisper (Voice language: EN/IT)"
        : serverWhisperAvailable
          ? "MediaRecorder not available in this browser"
          : "Server: install faster-whisper (or openai-whisper), or set WHISPER_STT=1";
    }

    function fillSourceChips(metaEl, data) {
      metaEl.textContent = "";
      const wrap = document.createElement("div");
      wrap.className = "source-chips";
      const src = data.sources || [];
      for (const s of src.slice(0, 12)) {
        const sc = Number(s.score);
        const scoreStr = Number.isFinite(sc) ? sc.toFixed(2) : String(s.score ?? "");
        const label = `p.${s.page} · ${scoreStr}`;
        const p = Number(s.page);
        const pdfOk = !!(data && data.manual_pdf_available);
        const hasPage = pdfOk && Number.isFinite(p) && p >= 1;
        const chip = document.createElement(hasPage ? "a" : "span");
        chip.className = "source-chip" + (hasPage ? " source-chip-link" : "");
        if (hasPage) {
          chip.href = `/api/manual#page=${Math.floor(p)}`;
          chip.target = "_blank";
          chip.rel = "noopener noreferrer";
          chip.title = `Open manual PDF at page ${Math.floor(p)}`;
        }
        chip.textContent = label;
        wrap.appendChild(chip);
      }
      if (wrap.children.length) metaEl.appendChild(wrap);
      const cm = (data && data.community_matches) || [];
      if (cm.length) {
        const cw = document.createElement("div");
        cw.className = "source-chips";
        cw.style.marginTop = "0.35rem";
        for (const m of cm.slice(0, 4)) {
          const chip = document.createElement("span");
          chip.className = "source-chip community-chip";
          const who = m.author || "?";
          chip.textContent = `${who} · ${m.age_phrase || ""}`;
          chip.title = m.chip_title || m.question_preview || "";
          cw.appendChild(chip);
        }
        metaEl.appendChild(cw);
      }
    }

    function setupCommunitySaveUI(slot, questionText, answerText) {
      slot.innerHTML = "";
      if (!serverCommunityEnabled) return;
      let savedTipId = "";
      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "community-save-toggle";
      toggle.textContent = "Save a field note for others (community)";
      const panel = document.createElement("div");
      panel.className = "community-save-panel";
      panel.setAttribute("aria-hidden", "true");
      const st = document.createElement("div");
      st.className = "community-save-status";
      const authorInp = document.createElement("input");
      authorInp.type = "text";
      authorInp.placeholder = "Your name (optional)";
      authorInp.maxLength = 120;
      const commentTa = document.createElement("textarea");
      commentTa.placeholder = "How you solved it or what worked in the field (required)";
      commentTa.maxLength = 4000;
      commentTa.rows = 2;
      const saveBtn = document.createElement("button");
      saveBtn.type = "button";
      saveBtn.className = "btn-secondary";
      saveBtn.textContent = "Save note";
      const deleteBtn = document.createElement("button");
      deleteBtn.type = "button";
      deleteBtn.className = "btn-secondary btn-danger";
      deleteBtn.textContent = "Delete saved note";
      deleteBtn.disabled = true;
      toggle.addEventListener("click", () => {
        const open = !panel.classList.contains("open");
        panel.classList.toggle("open", open);
        panel.setAttribute("aria-hidden", open ? "false" : "true");
        if (open) commentTa.focus();
      });
      saveBtn.addEventListener("click", async () => {
        const comment = commentTa.value.trim();
        if (!comment) {
          st.textContent = "Please enter a note in the text box.";
          st.className = "community-save-status err";
          return;
        }
        saveBtn.disabled = true;
        st.textContent = "Saving…";
        st.className = "community-save-status";
        try {
          const r = await fetch("/api/community-save", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              question: questionText,
              comment,
              author: authorInp.value.trim(),
              answer_snapshot: (answerText || "").slice(0, 4000),
            }),
          });
          const raw = await r.text();
          let j = {};
          try {
            j = raw ? JSON.parse(raw) : {};
          } catch (_) {}
          if (!r.ok) {
            const detail =
              j.detail !== undefined
                ? typeof j.detail === "string"
                  ? j.detail
                  : JSON.stringify(j.detail)
                : raw || r.statusText;
            throw new Error(detail);
          }
          savedTipId = String(j.id || "").trim();
          st.textContent = "Saved — others may see this on similar questions.";
          st.className = "community-save-status ok";
          deleteBtn.disabled = !savedTipId;
          panel.classList.remove("open");
          commentTa.value = "";
        } catch (e) {
          st.textContent = String(e.message || e);
          st.className = "community-save-status err";
        }
        saveBtn.disabled = false;
      });
      deleteBtn.addEventListener("click", async () => {
        if (!savedTipId) {
          st.textContent = "No saved note id found in this panel.";
          st.className = "community-save-status err";
          return;
        }
        if (!window.confirm("Delete this saved community note?")) return;
        deleteBtn.disabled = true;
        st.textContent = "Deleting…";
        st.className = "community-save-status";
        try {
          const r = await fetch(`/api/community/${encodeURIComponent(savedTipId)}`, {
            method: "DELETE",
          });
          const raw = await r.text();
          let j = {};
          try {
            j = raw ? JSON.parse(raw) : {};
          } catch (_) {}
          if (!r.ok) {
            const detail =
              j.detail !== undefined
                ? typeof j.detail === "string"
                  ? j.detail
                  : JSON.stringify(j.detail)
                : raw || r.statusText;
            throw new Error(detail);
          }
          savedTipId = "";
          deleteBtn.disabled = true;
          st.textContent = "Deleted.";
          st.className = "community-save-status ok";
        } catch (e) {
          st.textContent = String(e.message || e);
          st.className = "community-save-status err";
          deleteBtn.disabled = false;

    function initStt() {
      if (!SpeechRecognition) {
        $("btnStt").disabled = true;
        $("btnStt").textContent = "Voice unavailable";
        $("sttLang").disabled = true;
        return;
      }
      stt = new SpeechRecognition();
      stt.lang = $("sttLang").value || "en-US";
      stt.interimResults = true;
      stt.continuous = true;

      stt.onresult = (event) => {
        let all = "";
        for (let i = 0; i < event.results.length; i++) {
          all += event.results[i][0].transcript + " ";
        }
        sttTranscript = all.trim();
      };

      stt.onerror = (event) => {
        sttActive = false;
        const ctx = sttContext;
        if (ctx && ctx.type === "community" && ctx.statusEl) {
          ctx.statusEl.textContent = `Speech recognition error: ${event.error || "unknown"}`;
          ctx.statusEl.className = "community-save-status err";
        } else {
          $("chatStatus").textContent = `Speech recognition error: ${event.error || "unknown"}`;
          $("chatStatus").className = "status err";
        }
        setSttUi(false);
        sttContext = null;
        setCommunitySttButtonsEnabled(true);
      };

      stt.onend = () => {
        // Handle normal stop (user clicked Stop) and unexpected end.
        const shouldFinalize = sttActive || sttStopRequested;
        const ctx = sttContext;
        sttActive = false;
        sttStopRequested = false;
        setSttUi(false);
        sttContext = null;
        setCommunitySttButtonsEnabled(true);
        if (!shouldFinalize) return;
        if (sttTranscript) {
          if (ctx && ctx.type === "community" && ctx.textarea) {
            const cur = ctx.textarea.value.trimEnd();
            ctx.textarea.value = cur ? `${cur} ${sttTranscript}` : sttTranscript;
            if (ctx.statusEl) {
              ctx.statusEl.textContent = "Voice added to note — edit if needed, then Save note.";
              ctx.statusEl.className = "community-save-status ok";
            }
          } else {
            $("q").value = sttTranscript;
            $("chatStatus").textContent = "Voice transcribed to text.";
            $("chatStatus").className = "status ok";
          }
        } else if (ctx && ctx.type === "community" && ctx.statusEl) {
          ctx.statusEl.textContent = "No speech detected.";
          ctx.statusEl.className = "community-save-status err";
        } else {
          $("chatStatus").textContent = "No speech detected.";
          $("chatStatus").className = "status err";
        }
      };
    }

    async function submitAsk() {
      if ($("btnAsk").disabled) return;
      const message = $("q").value.trim();
      if (!message) return;
      $("btnAsk").disabled = true;
      $("chatStatus").textContent = "Asking…";
      $("chatStatus").className = "status";
      appendUserBubble(message);
      const { bubble, meta, communitySlot } = appendAssistantThinking();
      try {
        const historyPayload = chatHistory.slice(-CHAT_HISTORY_MAX_MESSAGES);
        const r = await fetch("/api/chat-stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history: historyPayload, model: currentChatModel || undefined }),
        });
        if (!r.ok) {
          const rawText = await r.text();
          let j = {};
          try {
            j = rawText ? JSON.parse(rawText) : {};
          } catch (_) {
            /* HTML or plain error body */
          }
          let detail = `HTTP ${r.status}`;
          if (j.detail !== undefined && j.detail !== null) {
            detail = Array.isArray(j.detail)
              ? j.detail
                  .map((x) => (typeof x === "string" ? x : x.msg || JSON.stringify(x)))
                  .join(". ")
              : String(j.detail);
          } else if (rawText && rawText.length < 200 && !rawText.trim().startsWith("{")) {
            detail = rawText.trim() || detail;
          }
          throw new Error(detail || r.statusText);
        }
        const reader = r.body && r.body.getReader ? r.body.getReader() : null;
        if (!reader) throw new Error("Streaming response is not supported in this browser.");
        const decoder = new TextDecoder();
        let pending = "";
        let streamedText = "";
        let finalPayload = null;
        bubble.removeAttribute("aria-busy");
        bubble.classList.remove("bubble-thinking");
        bubble.classList.remove("bubble-err");
        bubble.textContent = "";
        $("chatStatus").textContent = "Streaming…";
        $("chatStatus").className = "status";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          pending += decoder.decode(value, { stream: true });
          let nl = pending.indexOf("\n");
          while (nl >= 0) {
            const line = pending.slice(0, nl).trim();
            pending = pending.slice(nl + 1);
            if (line) {
              let evt = null;
              try {
                evt = JSON.parse(line);
              } catch (_) {
                evt = null;
              }
              if (evt && evt.type === "token") {
                const delta = String(evt.delta || "");
                if (delta) {
                  streamedText += delta;
                  bubble.textContent = streamedText;
                  scrollChatToBottom();
                }
              } else if (evt && evt.type === "done") {
                finalPayload = evt;
              } else if (evt && evt.type === "error") {
                throw new Error(String(evt.detail || "Streaming failed"));
              }
            }
            nl = pending.indexOf("\n");
          }
        }
        const tail = pending.trim();
        if (tail) {
          try {
            const evt = JSON.parse(tail);
            if (evt && evt.type === "done") finalPayload = evt;
            if (evt && evt.type === "error") {
              throw new Error(String(evt.detail || "Streaming failed"));
            }
          } catch (_) {
            if (_ instanceof Error) throw _;
            /* ignore trailing partial text */
          }
        }
        const j = finalPayload || { answer: streamedText, sources: [], community_matches: [] };
        bubble.removeAttribute("aria-busy");
        bubble.classList.remove("bubble-thinking");
        bubble.classList.remove("bubble-err");
        bubble.textContent = j.answer || streamedText;
        fillSourceChips(meta, j);
        setupCommunitySaveUI(communitySlot, message, j.answer || streamedText || "");
        chatHistory.push({ role: "user", content: message });
        chatHistory.push({ role: "assistant", content: j.answer || streamedText || "" });
        if (chatHistory.length > CHAT_HISTORY_MAX_MESSAGES) {
          chatHistory = chatHistory.slice(-CHAT_HISTORY_MAX_MESSAGES);
        }
        $("chatStatus").textContent = "Done.";
        $("chatStatus").className = "status ok";
        $("q").value = "";
        $("q").focus();
        scrollChatToBottom();
      } catch (e) {
        bubble.removeAttribute("aria-busy");
        bubble.classList.remove("bubble-thinking");
        bubble.classList.add("bubble-err");
        bubble.textContent = String(e.message || e);
        meta.textContent = "";
        if (communitySlot) communitySlot.innerHTML = "";
        $("chatStatus").textContent = "Error.";
        $("chatStatus").className = "status err";
      }
      $("btnAsk").disabled = false;
    }

    async function runWhisperRecording(ctx) {
      const isCommunity = ctx && ctx.type === "community";

      if (whisperRec && whisperRec.state === "recording") {
        try {
          whisperRec.requestData();
        } catch (_) {}
        whisperRec.stop();
        return;
      }

      whisperContext = isCommunity ? ctx : null;

      try {
        whisperMimeType = pickWhisperMime();
        whisperChunks = [];
        whisperStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const opts = whisperMimeType ? { mimeType: whisperMimeType } : undefined;
        whisperRec = new MediaRecorder(whisperStream, opts);
        whisperMimeType = whisperRec.mimeType || whisperMimeType || "audio/webm";

        whisperRec.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) whisperChunks.push(e.data);
        };

        whisperRec.onstop = async () => {
          const stopCtx = whisperContext;
          try {
            if (whisperStream) {
              whisperStream.getTracks().forEach((t) => t.stop());
              whisperStream = null;
            }
            setWhisperUi(false);
            whisperContext = null;
            setCommunityWhisperButtonsEnabled(true);
            const blob = new Blob(whisperChunks, { type: whisperMimeType || "audio/webm" });
            whisperChunks = [];
            whisperRec = null;
            const statusLine = (msg, cls) => {
              if (stopCtx && stopCtx.type === "community" && stopCtx.statusEl) {
                stopCtx.statusEl.textContent = msg;
                stopCtx.statusEl.className =
                  cls === "err" ? "community-save-status err" : cls === "ok" ? "community-save-status ok" : "community-save-status";
              } else {
                $("chatStatus").textContent = msg;
                $("chatStatus").className = "status " + (cls || "");
              }
            };
            if (blob.size < 200) {
              statusLine("Recording too short.", "err");
              return;
            }
            const fd = new FormData();
            fd.append("file", blob, "recording.webm");
            const langSel = ($("sttLang").value || "en-US").toLowerCase();
            fd.append("language", langSel.startsWith("it") ? "it" : "en");
            statusLine("Transcribing with Whisper…", "");
            const r = await fetch("/api/transcribe", { method: "POST", body: fd });
            const raw = await r.text();
            let j = {};
            try {
              j = raw ? JSON.parse(raw) : {};
            } catch (_) {}
            if (!r.ok) {
              const detail =
                j.detail !== undefined
                  ? typeof j.detail === "string"
                    ? j.detail
                    : JSON.stringify(j.detail)
                  : raw || r.statusText;
              throw new Error(detail);
            }
            const transcribed = String(j.text != null ? j.text : "").trim();
            if (!transcribed) {
              statusLine(
                "Whisper returned no text (often: mic too quiet, very short clip, or wrong Voice language). Try again — or toggle EN/IT, speak longer, or use Voice to note.",
                "err",
              );
              return;
            }
            if (stopCtx && stopCtx.type === "community" && stopCtx.textarea) {
              const cur = stopCtx.textarea.value.trimEnd();
              stopCtx.textarea.value = cur ? `${cur} ${transcribed}` : transcribed;
              stopCtx.textarea.focus();
              statusLine(
                j.backend
                  ? `Transcribed (${j.backend}). Edit if needed, then Save note.`
                  : "Transcribed. Edit if needed, then Save note.",
                "ok",
              );
            } else {
              const qEl = $("q");
              if (qEl) {
                qEl.value = transcribed;
                qEl.focus();
              }
              $("chatStatus").textContent = j.backend
                ? `Transcribed (${j.backend}). Edit text if needed, then Ask.`
                : "Transcribed. Edit if needed, then Ask.";
              $("chatStatus").className = "status ok";
            }
          } catch (e) {
            setWhisperUi(false);
            whisperContext = null;
            setCommunityWhisperButtonsEnabled(true);
            applyWhisperBtnState();
            if (stopCtx && stopCtx.type === "community" && stopCtx.statusEl) {
              stopCtx.statusEl.textContent = String(e.message || e);
              stopCtx.statusEl.className = "community-save-status err";
            } else {
              $("chatStatus").textContent = String(e.message || e);
              $("chatStatus").className = "status err";
            }
          }
        };

        whisperRec.start(250);
        document.querySelectorAll(".btn-community-whisper").forEach((btn) => {
          if (!isCommunity) btn.disabled = true;
          else btn.disabled = btn !== ctx.whisperBtn;
        });
        if (!isCommunity) setCommunityWhisperButtonsEnabled(false);
        setWhisperUi(true);
        if (isCommunity && ctx.statusEl) {
          ctx.statusEl.textContent = "Recording… click Stop & send when finished.";
          ctx.statusEl.className = "community-save-status";
        } else {
          $("chatStatus").textContent = "Recording… click Stop & send when finished.";
          $("chatStatus").className = "status";
        }
      } catch (e) {
        setWhisperUi(false);
        whisperContext = null;
        setCommunityWhisperButtonsEnabled(true);
        applyWhisperBtnState();
        if (whisperStream) {
          whisperStream.getTracks().forEach((t) => t.stop());
          whisperStream = null;
        }
        whisperRec = null;
        if (isCommunity && ctx.statusEl) {
          ctx.statusEl.textContent = String(e.message || e);
          ctx.statusEl.className = "community-save-status err";
        } else {
          $("chatStatus").textContent = String(e.message || e);
          $("chatStatus").className = "status err";
        }
      }
    }

    });
    $("srvStatusDot").addEventListener("click", (e) => {
      e.stopPropagation();
      toggleStatusPopover();
    });
    document.addEventListener("click", (e) => {
      if (!statusPopoverOpen) return;
      const menu = $("srvStatusMenu");
      if (menu && !menu.contains(e.target)) toggleStatusPopover(false);
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && statusPopoverOpen) toggleStatusPopover(false);
    });

    (function initComposerCollapse() {
      const coPan = document.getElementById("composerPanel");
      const coTog = document.getElementById("btnComposerToggle");
      if (!coPan || !coTog) return;
      const icon = coTog.querySelector(".composer-toggle-icon");
      const lbl = coTog.querySelector(".composer-toggle-label");
      function applyCollapsedUi(collapsed) {
        coTog.setAttribute("aria-expanded", collapsed ? "false" : "true");
        coTog.title = collapsed
          ? "Show ask and search panel"
          : "Hide ask and search panel to read the chat";
        if (icon) icon.textContent = collapsed ? "▲" : "▼";
        if (lbl) lbl.textContent = collapsed ? "Show search" : "Hide search";
      }
      coTog.addEventListener("click", () => {
        if (!window.matchMedia("(max-width: 720px)").matches) return;
        const collapsed = coPan.classList.toggle("composer--collapsed");
        applyCollapsedUi(collapsed);
        scrollChatToBottom();
      });
      window.addEventListener("resize", () => {
        if (!window.matchMedia("(max-width: 720px)").matches && coPan.classList.contains("composer--collapsed")) {
          coPan.classList.remove("composer--collapsed");
          applyCollapsedUi(false);
        }
      });
    })();

    if (window.matchMedia("(max-width: 720px)").matches) {
      const dr = document.querySelector(".pdf-drawer");
      if (dr) dr.removeAttribute("open");
    }
    refreshStatus();
    refreshModelOptions();
  </script>
</body>
</html>
