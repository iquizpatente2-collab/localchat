services:
  localchat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: localchat-app
    ports:
      - "8082:8080"
    environment:
      # Default: Ollama on this PC (Docker Desktop → Windows host).
      # Office DGX: set in `.env` → OLLAMA_HOST=http://192.168.0.99:11434
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3.6:latest}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_CHAT_FALLBACK: ${OLLAMA_CHAT_FALLBACK:-gemma4:latest}
      RAG_CHAT_TIMEOUT_S: "600"
      RAG_EMBED_CONCURRENCY: ${RAG_EMBED_CONCURRENCY:-1}
      RAG_EMBED_PAUSE_S: ${RAG_EMBED_PAUSE_S:-0.75}
      RAG_BUILD_RECIPE_INDEX: ${RAG_BUILD_RECIPE_INDEX:-0}
      RAG_MANUAL_FRONT_MODE: "never"
      RAG_AUTO_DOCS: "0"
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs
    extra_hosts:
      # Linux: reach Ollama on the host at host.docker.internal (see env.local.example).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
